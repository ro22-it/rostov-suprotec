<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0055a5">
<link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Супротек Ростов</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="top-bar">
    <div class="container top-bar-inner">
      <div class="top-info">
        <span class="official-badge">✓ Официальный представитель производителя в Ростове-на-Дону</span>
      </div>
      <div class="top-contacts">
        <a href="tel:+79289002221" class="top-phone">8 (928) 900-22-21</a>
        <span class="top-worktime">Пн-Сб: 9:00 - 19:00</span>
      </div>
    </div>
  </div>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-wrapper">
          <span class="logo-text-main">СУПРОТЕК</span>
          <span class="logo-text-sub">РОСТОВ</span>
        </div>
      </a>
    </div>
  </header>

  <section class="auth-section">
    <div class="container">
      <div class="auth-card">
        <h2>Вход в личный кабинет</h2>
        <form id="loginForm">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" required>
          </div>
          <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn-primary">Войти</button>
          <div class="auth-links">
            <a href="register.html">Нет аккаунта? Зарегистрироваться</a>
          </div>
        </form>
        <div id="loginError" class="error-message"></div>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = data.user.role === 'admin' ? 'admin.html' : 'account.html';
        } else {
          document.getElementById('loginError').textContent = data.error;
        }
      } catch (err) {
        document.getElementById('loginError').textContent = 'Ошибка соединения';
      }
    });
  </script>
</body>
</html>
